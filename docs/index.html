<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spy App Support</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    /* Sıfırlama ve Temel Ayarlar */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif; /* Modern font */
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #333;
      /* Premium koyu arka plan */
      background: linear-gradient(135deg, #1a1c2c 0%, #2a3040 100%);
    }

    .container {
      width: 100%;
      max-width: 500px; /* Kart genişliği kompakt ve odaklı */
    }

    /* Ana Kart Tasarımı */
    .card {
      background: #ffffff;
      padding: 40px 30px; 
      border-radius: 24px; 
      /* Daha sofistike, yaygın gölge */
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      text-align: center;
    }

    h1 {
      font-weight: 700;
      font-size: 28px;
      color: #111;
      margin-bottom: 25px;
      letter-spacing: -0.5px;
    }

    /* Başlığın yanındaki küçük premium ikon */
    h1::before {
      content: '🕵️‍♂️'; 
      font-size: 24px;
      margin-right: 10px;
      vertical-align: middle;
    }

    .card p {
      color: #555; 
      margin-bottom: 20px;
      line-height: 1.7;
      font-size: 15px;
    }

    .button-group {
      margin-top: 35px;
      display: flex;
      flex-direction: column;
      gap: 12px; /* Butonlar arası boşluk */
    }

    /* Premium Buton Stili */
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%; 
      padding: 14px 20px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      color: white;
      /* Tek tip, koyu, şık arka plan rengi */
      background: #2c3e50; 
      border: 1px solid transparent;
      transition: all 0.3s ease;
    }

    /* Buton ikonları için ayar */
    .btn span {
      margin-right: 12px;
      font-size: 18px;
    }

    /* Hover Efekti */
    .btn:hover {
      background: #3b4d61;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    .btn:active {
      transform: scale(0.98);
    }

    /* Terms butonu için outline (çerçeveli) stil - hiyerarşi katar */
    .btn-outline {
        background: transparent;
        border: 2px solid #2c3e50;
        color: #2c3e50;
    }
    .btn-outline:hover {
        background: #2c3e50;
        color: #fff;
    }

  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      <h1>Spy App Support</h1>
      
      <p>Welcome to the official support hub for <strong>Spy 3+ Player Party Game</strong>. We're here to help you keep the fun going!</p>
      <p style="font-size: 14px; color: #777;">Need assistance, found a bug, or have feedback? Select an option below:</p>
      
      <div class="button-group">
        <a href="mailto:emirhan8akyildirim@gmail.com" class="btn">
          <span>📧</span> Contact via Email
        </a>
        <a href="https://www.linkedin.com/in/emirhan-akyildirim/" target="_blank" class="btn">
          <span>🔗</span> LinkedIn Profile
        </a>
        <a href="https://docs.google.com/document/d/1WO3u1dAJcC9EVi52CGXhTFwYrcQJfMeBcPMgEuc0b-8/edit?usp=sharing" target="_blank" class="btn">
          <span>📄</span> Privacy Policy
        </a>
        
        <a href="https://docs.google.com/document/d/1n4B6K7r4InWrpVVnZELZ6UZDAXAYTwiyBAovGf0pC-Q/edit?usp=sharing" target="_blank" class="btn btn-outline">
            <span>📜</span> Terms of Use
        </a>
      </div>

    </div>
  </div>

</body>
</html>
