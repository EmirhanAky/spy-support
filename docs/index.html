<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spy App Support</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    /* Sıfırlama */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #333;
      
      /* --- YENİ ARKAPLAN: Eğlenceli ve Gizemli Gece --- */
      /* Daha derin maviler ve canlı morlar - Gece görevi hissi */
      background: linear-gradient(135deg, #1e0059 0%, #4a00e0 100%);
      background-attachment: fixed;
    }

    .container {
      width: 100%;
      max-width: 480px; /* Biraz daha daraltıp kompaktlaştırdım */
    }

    /* Ana Kart */
    .card {
      background: #ffffff;
      padding: 45px 35px;
      border-radius: 30px; /* Daha yuvarlak, modern köşeler */
      /* Gölgeye renk kattık, sanki arkadan ışık vuruyor gibi */
      box-shadow: 0 30px 60px rgba(30, 0, 89, 0.5);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    h1 {
      font-weight: 800; /* Daha kalın başlık */
      font-size: 32px;
      color: #1e0059; /* Koyu indigo başlık rengi */
      margin-bottom: 20px;
      letter-spacing: -1px;
    }

    h1::before {
      content: '🕵️‍♂️'; 
      font-size: 36px; /* Emoji biraz büyüdü */
      display: block; /* Emojiyi başlığın üstüne aldım */
      margin-bottom: 10px;
    }

    .card p {
      color: #5a5a7a; /* Biraz daha mavimsi gri metin */
      margin-bottom: 25px;
      line-height: 1.6;
      font-size: 16px;
      font-weight: 500;
    }

    .button-group {
      margin-top: 40px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    /* --- GENEL BUTON YAPISI --- */
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%; 
      padding: 16px 20px; /* Biraz daha büyük butonlar */
      border-radius: 16px; /* Daha yuvarlak */
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      color: white;
      border: none;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); /* Daha yumuşak animasyon */
      position: relative;
      z-index: 1;
    }

    .btn span {
      margin-right: 12px;
      font-size: 20px;
    }

    .btn:active {
      transform: scale(0.95) !important; /* Tıklama efekti */
    }

    /* --- 1. AKSİYON BUTONLARI (Gradyanlı ve Enerjik) --- */
    
    /* Email: Canlı Mor-Pembe Gradyan */
    .btn-email {
      background: linear-gradient(90deg, #6a11cb 0%, #2575fc 100%);
      box-shadow: 0 10px 20px rgba(37, 117, 252, 0.3);
    }
    
    /* LinkedIn: Elektrik Mavisi Gradyan */
    .btn-linkedin {
      background: linear-gradient(90deg, #0061ff 0%, #60efff 100%);
      box-shadow: 0 10px 20px rgba(0, 97, 255, 0.3);
    }

    /* Aksiyon butonları hover efekti: Parlama ve yükselme */
    .btn-email:hover, .btn-linkedin:hover {
      transform: translateY(-5px);
      filter: brightness(1.15); /* Rengi parlatır */
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4);
    }


    /* --- 2. GİZLİ DOSYA BUTONLARI (Privacy & Terms) --- */
    /* Gri yerine "Stealth Mod" (Koyu Lacivert) */
    .btn-legal {
      background: #1a1a2e; /* Çok koyu, desatüre lacivert */
      color: #a0a0b0; /* Sönük, metalik yazı rengi */
      font-weight: 600;
      border: 2px solid transparent; /* Hover için sınır hazırlığı */
    }

    .btn-legal:hover {
      background: #252540; /* Biraz açılır */
      color: #ffffff; /* Yazı parlar */
      border-color: #4a00e0; /* Mor bir çerçeve belirir */
      transform: translateY(-3px);
    }

  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      <h1>Spy App Support</h1>
      
      <p>Welcome, Agent! This is the secure channel for the <strong>Spy 3+ Player Party Game</strong>.</p>
      <p style="font-size: 15px; color: #7a7a9a;">Report a bug, request backup, or check classified documents below:</p>
      
      <div class="button-group">
        <a href="mailto:emirhan8akyildirim@gmail.com" class="btn btn-email">
          <span>📧</span> Contact HQ via Email
        </a>
        <a href="https://www.linkedin.com/in/emirhan-akyildirim/" target="_blank" class="btn btn-linkedin">
          <span>🔗</span> Connect on LinkedIn
        </a>

        <a href="https://docs.google.com/document/d/1WO3u1dAJcC9EVi52CGXhTFwYrcQJfMeBcPMgEuc0b-8/edit?usp=sharing" target="_blank" class="btn btn-legal">
          <span>📂</span> Privacy Policy (Classified)
        </a>
        <a href="https://docs.google.com/document/d/1n4B6K7r4InWrpVVnZELZ6UZDAXAYTwiyBAovGf0pC-Q/edit?usp=sharing" target="_blank" class="btn btn-legal">
          <span>📜</span> Terms of Use (Top Secret)
        </a>
      </div>

    </div>
  </div>

</body>
</html>
