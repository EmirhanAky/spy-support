<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spy App Support</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    /* Sıfırlama ve Temel Ayarlar */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #333;
      
      /* Arkaplan: Mat Mor Gradient */
      background: linear-gradient(135deg, #534363 0%, #2a2233 100%);
      background-attachment: fixed;
    }

    .container {
      width: 100%;
      max-width: 500px;
    }

    /* Ana Kart */
    .card {
      background: #ffffff;
      padding: 40px 30px; 
      border-radius: 24px; 
      box-shadow: 0 20px 40px rgba(42, 34, 51, 0.4);
      text-align: center;
    }

    h1 {
      font-weight: 700;
      font-size: 28px;
      color: #2a2233;
      margin-bottom: 25px;
      letter-spacing: -0.5px;
    }

    h1::before {
      content: '🕵️‍♂️'; 
      font-size: 24px;
      margin-right: 10px;
      vertical-align: middle;
    }

    .card p {
      color: #665c70;
      margin-bottom: 20px;
      line-height: 1.7;
      font-size: 15px;
    }

    .button-group {
      margin-top: 35px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* --- GENEL BUTON AYARLARI --- */
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%; 
      padding: 14px 20px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      color: white;
      border: 1px solid transparent;
      transition: all 0.3s ease;
    }

    .btn span {
      margin-right: 12px;
      font-size: 18px;
    }

    .btn:active {
      transform: scale(0.98);
    }

    /* --- 1. EMAIL: Mat Mor (Tema Rengi) --- */
    .btn-email {
      background: #6d5885;
    }
    .btn-email:hover {
      background: #594670;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(109, 88, 133, 0.3);
    }

    /* --- 2. LINKEDIN: Mat Mavi --- */
    .btn-linkedin {
      background: #4a6fa5;
    }
    .btn-linkedin:hover {
      background: #3b5a85;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(74, 111, 165, 0.3);
    }

    /* --- 3. LEGAL (Privacy & Terms): Mat Gri (Geri Planda) --- */
    /* Bu renk dikkati üstüne çekmez ama şık durur */
    .btn-legal {
      background: #4a4e56; /* Koyu gri/antrasit */
    }
    .btn-legal:hover {
      background: #36393f;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(74, 78, 86, 0.3);
    }

  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      <h1>Spy App Support</h1>
      
      <p>Welcome to the official support hub for <strong>Spy 3+ Player Party Game</strong>. We're here to help you keep the fun going!</p>
      <p style="font-size: 14px; color: #887a94;">Need assistance, found a bug, or have feedback? Select an option below:</p>
      
      <div class="button-group">
        <a href="mailto:emirhan8akyildirim@gmail.com" class="btn btn-email">
          <span>📧</span> Contact via Email
        </a>
        <a href="https://www.linkedin.com/in/emirhan-akyildirim/" target="_blank" class="btn btn-linkedin">
          <span>🔗</span> LinkedIn Profile
        </a>

        <a href="https://docs.google.com/document/d/1WO3u1dAJcC9EVi52CGXhTFwYrcQJfMeBcPMgEuc0b-8/edit?usp=sharing" target="_blank" class="btn btn-legal">
          <span>📄</span> Privacy Policy
        </a>
        <a href="https://docs.google.com/document/d/1n4B6K7r4InWrpVVnZELZ6UZDAXAYTwiyBAovGf0pC-Q/edit?usp=sharing" target="_blank" class="btn btn-legal">
          <span>📜</span> Terms of Use
        </a>
      </div>

    </div>
  </div>

</body>
</html>
