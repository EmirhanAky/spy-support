<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spy App Support</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    /* Sıfırlama */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #333;
      
      /* --- GÜNCELLENEN ARKAPLAN (SwipeClean Tarzı) --- */
      /* Attığın görseldeki gibi soldan sağa Mor'dan Turuncu/Kırmızıya geçiş */
      background: linear-gradient(135deg, #6a11cb 0%, #ff4b2b 100%);
      background-attachment: fixed;
    }

    .container {
      width: 100%;
      max-width: 480px; 
    }

    /* Ana Kart */
    .card {
      background: #ffffff;
      padding: 45px 35px;
      border-radius: 30px; 
      /* Gölgeyi biraz yumuşattım ki renkli arka planda güzel dursun */
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.25);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    h1 {
      font-weight: 800; 
      font-size: 32px;
      color: #1e0059; 
      margin-bottom: 20px;
      letter-spacing: -1px;
    }

    h1::before {
      content: '🕵️‍♂️'; 
      font-size: 36px; 
      display: block; 
      margin-bottom: 10px;
    }

    .card p {
      color: #5a5a7a; 
      margin-bottom: 25px;
      line-height: 1.6;
      font-size: 16px;
      font-weight: 500;
    }

    .button-group {
      margin-top: 40px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    /* --- BUTONLAR --- */
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%; 
      padding: 16px 20px; 
      border-radius: 16px; 
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      color: white;
      border: none;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      position: relative;
      z-index: 1;
    }

    .btn span {
      margin-right: 12px;
      font-size: 20px;
    }

    .btn:active {
      transform: scale(0.95) !important;
    }

    /* Email: Canlı Mor-Pembe Gradyan */
    .btn-email {
      background: linear-gradient(90deg, #6a11cb 0%, #2575fc 100%);
      box-shadow: 0 10px 20px rgba(37, 117, 252, 0.3);
    }
    
    /* LinkedIn: Elektrik Mavisi Gradyan */
    .btn-linkedin {
      background: linear-gradient(90deg, #0061ff 0%, #60efff 100%);
      box-shadow: 0 10px 20px rgba(0, 97, 255, 0.3);
    }

    .btn-email:hover, .btn-linkedin:hover {
      transform: translateY(-5px);
      filter: brightness(1.15); 
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4);
    }

    /* Gizli Dosya Butonları (Stealth Mod) */
    .btn-legal {
      background: #1a1a2e; 
      color: #a0a0b0; 
      font-weight: 600;
      border: 2px solid transparent; 
    }

    .btn-legal:hover {
      background: #252540; 
      color: #ffffff; 
      border-color: #6a11cb; /* Çerçeveyi arka planla uyumlu mor yaptım */
      transform: translateY(-3px);
    }

  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      <h1>Spy App Support</h1>
      
      <p>Welcome, Agent! This is the secure channel for the <strong>Spy 3+ Player Party Game</strong>.</p>
      <p style="font-size: 15px; color: #7a7a9a;">Report a bug, request backup, or check classified documents below:</p>
      
      <div class="button-group">
        <a href="mailto:emirhan8akyildirim@gmail.com" class="btn btn-email">
          <span>📧</span> Contact HQ via Email
        </a>
        <a href="https://www.linkedin.com/in/emirhan-akyildirim/" target="_blank" class="btn btn-linkedin">
          <span>🔗</span> Connect on LinkedIn
        </a>

        <a href="https://docs.google.com/document/d/1WO3u1dAJcC9EVi52CGXhTFwYrcQJfMeBcPMgEuc0b-8/edit?usp=sharing" target="_blank" class="btn btn-legal">
          <span>📂</span> Privacy Policy
        </a>
        <a href="https://docs.google.com/document/d/1n4B6K7r4InWrpVVnZELZ6UZDAXAYTwiyBAovGf0pC-Q/edit?usp=sharing" target="_blank" class="btn btn-legal">
          <span>📜</span> Terms of Use
        </a>
      </div>

    </div>
  </div>

</body>
</html>
